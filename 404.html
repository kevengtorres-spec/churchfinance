<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Página não encontrada · Church Finance</title>
  <link rel="icon" type="image/svg+xml" href="/logo.png" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1rem; background: #162013; color: #fff;
      font-family: Manrope, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { width: 100%; max-width: 24rem; text-align: center; }
    .code { margin: 0 0 .5rem; font-size: 4rem; font-weight: 800; color: #53d22c; line-height: 1; }
    h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
    p { margin: 0 0 1.5rem; color: #a2c398; line-height: 1.5; }
    a {
      display: inline-block; padding: .75rem 2rem; border-radius: 999px; background: #53d22c;
      color: #162013; font-weight: 700; text-decoration: none;
    }
    a:hover { filter: brightness(.95); }
    a:focus-visible { outline: 2px solid #8cd279; outline-offset: 2px; }
  </style>
</head>

<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Página não encontrada</h1>
    <p>O endereço que você tentou abrir não existe ou foi movido.</p>
    <a href="/index.html">Voltar ao início</a>

</html>
