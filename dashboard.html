<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#162013" />
  <title>Dashboard · Church Finance</title>
  <link rel="icon" type="image/svg+xml" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com/3.4.1?plugins=forms"></script>
  <script src="js/tailwind-config.js"></script>
</head>

<body class="bg-canvas font-sans text-white">

  <div id="loadingOverlay" role="status" class="fixed inset-0 z-50 flex items-center justify-center bg-canvas">
    <div class="space-y-2 text-center">
      <div class="mx-auto h-8 w-8 animate-spin rounded-full border-4 border-accent border-t-transparent"></div>
      <p class="text-sm text-muted">Verificando sessão...</p>
    </div>
  </div>

  <div id="app-shell">
  <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-6 sm:px-6 md:px-10">
    <div class="mb-6 flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="text-3xl font-bold">Dashboard</h1>
        <p class="text-sm text-muted">Visão geral das entradas da igreja</p>
      </div>
      <div>
        <label for="periodSelect" class="mb-1 block text-xs font-medium text-muted">Período</label>
        <select id="periodSelect" class="rounded-lg border-edge bg-surface py-2 pl-3 pr-9 text-sm text-white">
          <option value="30">Últimos 30 dias</option>
          <option value="90">Últimos 90 dias</option>
          <option value="365">Últimos 12 meses</option>
          <option value="0">Todos os períodos</option>
        </select>
      </div>
    </div>

    <!-- Indicadores -->
    <section aria-label="Indicadores" class="grid grid-cols-2 gap-4 lg:grid-cols-4">
      <div class="rounded-xl bg-field p-5">
        <p class="text-sm text-muted">Total arrecadado</p>
        <p id="kpiTotal" class="mt-1 text-2xl font-bold">—</p>
      </div>
      <div class="rounded-xl bg-field p-5">
        <p class="text-sm text-muted">Relatórios</p>
        <p id="kpiCount" class="mt-1 text-2xl font-bold">—</p>
      </div>
      <div class="rounded-xl bg-field p-5">
        <p class="text-sm text-muted">Pendentes</p>
        <p id="kpiPending" class="mt-1 text-2xl font-bold">—</p>
      </div>
      <div class="rounded-xl bg-field p-5">
        <p class="text-sm text-muted">Divergentes</p>
        <p id="kpiDivergent" class="mt-1 text-2xl font-bold">—</p>
      </div>
    </section>

    <!-- Entradas por categoria -->
    <section class="mt-8" aria-labelledby="catTitle">
      <h2 id="catTitle" class="mb-3 text-[22px] font-bold">Entradas por categoria</h2>
      <div id="categoryBars" class="space-y-4 rounded-xl border border-edge p-5">
        <p class="text-sm text-muted">Carregando...</p>
      </div>
    </section>

    <!-- Últimos relatórios -->
    <section class="mt-8" aria-labelledby="recentTitle">
      <div class="mb-3 flex items-center justify-between gap-4">
        <h2 id="recentTitle" class="text-[22px] font-bold">Últimos relatórios</h2>
        <a href="reports.html" class="text-sm font-medium text-mint hover:underline">Ver todos</a>
      </div>
      <div class="overflow-x-auto rounded-xl border border-edge">
        <table class="min-w-full text-left text-sm">
          <caption class="sr-only">Cinco relatórios mais recentes</caption>
          <thead class="bg-surface text-xs uppercase text-muted">
            <tr>
              <th scope="col" class="px-4 py-3">Data</th>
              <th scope="col" class="px-4 py-3 text-right">Total</th>
              <th scope="col" class="px-4 py-3">Conferentes</th>
              <th scope="col" class="px-4 py-3">Status</th>
            </tr>
          </thead>
          <tbody id="recentBody" class="divide-y divide-edge">
            <tr><td colspan="4" class="px-4 py-6 text-center text-muted">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>

</html>
